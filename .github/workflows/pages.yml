name: Deploy website

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset URLs with the commit
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s#(href=\"style\.css|src=\"js/main\.js)\"#\1?v=$v\"#" web/index.html
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$v'#" web/js/*.js
          grep -q "main.js?v=$v" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
